name: Publish Belles Creator demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check complete JavaScript files
        run: |
          test -s index.html
          test -s atelier.html
          for file in assets/data.js assets/app.js assets/public.js assets/admin.js assets/portal.js assets/i18n.js assets/config.js assets/cloud.js assets/atelier.js; do
            test -s "$file"
            node --check "$file"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp atelier.html _site/atelier.html
          cp assets/*.css assets/*.js _site/assets/
          mkdir -p _site/assets/img
          cp assets/img/* _site/assets/img/
          touch _site/.nojekyll
      # One artifact name per build attempt, so a re-run never finds two artifacts with the same name.
      # "Re-run failed jobs" re-runs only deploy and reuses this build's name through the job output.
      - name: Artifact name
        id: artifact
        run: echo "name=github-pages-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: ${{ steps.artifact.outputs.name }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact }}
