name: Publish Belles Creator demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check complete JavaScript files
        run: |
          test -s index.html
          test -s atelier.html
          for file in assets/data.js assets/app.js assets/public.js assets/admin.js assets/portal.js assets/i18n.js assets/config.js assets/cloud.js assets/atelier.js; do
            test -s "$file"
            node --check "$file"
          done
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files only
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp atelier.html _site/atelier.html
          cp assets/*.css assets/*.js _site/assets/
          mkdir -p _site/assets/img
          cp assets/img/* _site/assets/img/
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
